  gitignored, and its hashed directory name changes whenever a font URL does):

    d=$(basename $(ls -d public/fonts/*/))
    sed -i '' "s|public/fonts/[a-f0-9]*/|public/fonts/$d/|g" resources/og/og-image.html
    "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser" --headless \
      --allow-file-access-from-files --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --screenshot=public/og-image.png \
      "file://$PWD/resources/og/og-image.html"
-->
